<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>China Solar PV Export Board | Group 7</title>
<style>
/* ============================================================
   DESIGN TOKENS: every colour, font, size and spacing value lives here.
   ============================================================ */
@font-face{font-family:'IBM Plex Sans';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format('woff2')}
:root{
  /* colour */
  --bg:#F7F5F0;          /* warm off-white page */
  --surface:#FFFFFF;     /* cards */
  --surface-2:#FBFAF7;   /* subtle fills inside cards */
  --ink:#1E293B;         /* primary text, observed data */
  --ink-2:#475569;       /* secondary text */
  --ink-3:#5B6676;       /* captions, axis labels (5.3:1 on bg) */
  --line:#E2DED5;        /* borders, axis */
  --line-soft:#EDEAE3;   /* gridlines, row dividers */
  --accent:#A64B05;      /* solar amber: highlights only */
  --accent-soft:#FBF1E6;
  --fc-fill:#F6F1E8;     /* forecast region */
  --sc-base:#334155;     /* scenario: base */
  --sc-chal:#B42318;     /* scenario: challenging */
  --sc-opt:#0B8F7A;      /* scenario: optimistic (lines) */
  --sc-opt-ink:#0A6E63;  /* optimistic as text */
  --up:#15803D; --down:#B42318;
  --tag-bg:#F1EEE8;
  /* type */
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --fs-title:28px; --fs-h2:18px; --fs-h3:15px; --fs-kpi:30px; --fs-body:14px; --fs-small:12.5px; --fs-micro:11.5px;
  /* spacing (8px scale) */
  --sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:32px; --sp-6:48px; --sp-h:4px;
  /* shape */
  --radius:10px; --radius-s:6px;
  --shadow:0 1px 2px rgba(30,41,59,.04),0 1px 1px rgba(30,41,59,.03);
  --maxw:1280px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs-body)/1.55 var(--font);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--sp-3) var(--sp-6)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.005em;text-wrap:balance}
h1{font-size:var(--fs-title);line-height:1.2}
h2{font-size:var(--fs-h2);line-height:1.3}
h3{font-size:var(--fs-h3);line-height:1.35}
p{margin:0 0 var(--sp-1);max-width:72ch}
a{color:var(--accent);text-underline-offset:2px}
code{font-size:12.5px;background:var(--tag-bg);padding:1px 5px;border-radius:4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.muted{color:var(--ink-3)} .small{font-size:var(--fs-small);color:var(--ink-3)}

/* header */
.masthead{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--sp-3);flex-wrap:wrap;padding:var(--sp-4) 0 var(--sp-2)}
.masthead .kicker{font-size:var(--fs-micro);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:var(--sp-h)}
.masthead .sub{color:var(--ink-2);margin-top:var(--sp-h);max-width:70ch}
.meta{font-size:var(--fs-small);color:var(--ink-3);text-align:right;line-height:1.6}
.meta b{color:var(--ink-2);font-weight:500}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:var(--sp-3);overflow-x:auto;margin-bottom:var(--sp-3);scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-3);font:500 var(--fs-body) var(--font);padding:12px 0 10px;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
section.tab{display:none}section.tab.on{display:block}

/* grid */
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--sp-3);align-items:start}
.c-12{grid-column:span 12}.c-8{grid-column:span 8}.c-6{grid-column:span 6}.c-4{grid-column:span 4}.c-3{grid-column:span 3}
.stack{display:grid;gap:var(--sp-3);min-width:0}
@media(max-width:1080px){.c-8,.c-4{grid-column:span 12}.c-3{grid-column:span 6}}
@media(max-width:560px){.c-3{grid-column:span 12}}
@media(max-width:800px){.c-6{grid-column:span 12}.wrap{padding:0 var(--sp-2) var(--sp-6)}.meta{text-align:left}}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:var(--sp-3);min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-2)}
.card-head>div:first-child{flex:1 1 200px;min-width:0}.card-head>.tag,.card-head>.tags{flex:none}
.takeaway{color:var(--ink-2);font-size:var(--fs-body);margin:var(--sp-h) 0 0;max-width:70ch}
.card-foot{margin-top:var(--sp-2);font-size:var(--fs-small);color:var(--ink-3)}
.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius-s);padding:12px var(--sp-2);font-size:var(--fs-small);color:var(--ink-2);margin-bottom:var(--sp-3)}
.note b{color:var(--ink)}
.note.demo{border-left-color:var(--down);background:#FDF2F1;color:#7A1A12}
.empty{border:1px dashed var(--line);border-radius:var(--radius-s);padding:var(--sp-2);color:var(--ink-3);font-size:var(--fs-small);background:var(--surface-2)}

/* tags */
.tag{display:inline-flex;align-items:center;gap:5px;font:500 var(--fs-micro)/1.6 var(--font);padding:0 7px;border-radius:4px;background:var(--tag-bg);color:var(--ink-2);white-space:nowrap;vertical-align:middle}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75}
.tag.obs{color:var(--ink)} .tag.mod{color:#1D5C8A} .tag.ass{color:#8A5A00} .tag.prop{color:var(--ink-3)}
.tag.ok{color:var(--up);background:#EEF6F0} .tag.warn{color:#8A5A00;background:#FBF3E4} .tag.plain::before{display:none}

/* KPI tiles */
.kpi{align-self:stretch;display:flex;flex-direction:column}.kpi .row{margin-top:auto}
.kpi .label{font-size:var(--fs-small);color:var(--ink-3);display:flex;justify-content:space-between;gap:var(--sp-1);align-items:center}
.kpi .value{font-size:var(--fs-kpi);font-weight:500;letter-spacing:-.01em;line-height:1.15;margin:var(--sp-1) 0 2px}
.kpi .unit{font-size:var(--fs-small);color:var(--ink-3);font-weight:400;margin-left:4px}
.kpi .row{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--sp-1)}
.delta{font-size:var(--fs-small);font-weight:500}
.delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.flat{color:var(--ink-3)}
.delta .vs{color:var(--ink-3);font-weight:400}
.spark{display:block;flex:none}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:flex-end}
label.field{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-micro);font-weight:500;color:var(--ink-3)}
select{font:400 var(--fs-body) var(--font);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:6px 28px 6px 10px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
select.score{padding:4px 22px 4px 8px;background-position:calc(100% - 12px) 52%,calc(100% - 7px) 52%;min-width:58px}
.seg{display:inline-flex;background:var(--tag-bg);border-radius:var(--radius-s);padding:3px}
.seg button{background:none;border:0;color:var(--ink-2);padding:5px 12px;font:500 var(--fs-small) var(--font);cursor:pointer;border-radius:4px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(30,41,59,.12)}
.check{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-small);color:var(--ink-2);cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
.md .md-h{margin:var(--sp-4) 0 6px}.md h3.md-h{font-size:17px}.md p{margin:0 0 10px;max-width:80ch}.md .md-list{margin:0 0 12px 20px;padding:0;max-width:80ch}.md .md-list li{margin:3px 0}.md .md-code{background:var(--bg,#f4f2ee);border:1px solid var(--line,#e5e2db);border-radius:6px;padding:10px 12px;overflow:auto;font-size:13px;line-height:1.5;margin:0 0 12px}
.terms{display:grid;grid-template-columns:minmax(160px,220px) 1fr;gap:6px 18px;margin:0 0 var(--sp-2);font-size:var(--fs-small)}.terms dt{font-weight:600}.terms dd{margin:0;max-width:80ch}.terms .ex{display:block;color:var(--ink-2);font-style:italic;margin-top:2px}@media(max-width:700px){.terms{grid-template-columns:1fr}.terms dd{margin-bottom:6px}}
input[type=range]{width:100%;accent-color:var(--c,var(--accent));height:18px;margin:0}

/* tables */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
th{font-weight:500;font-size:var(--fs-small);color:var(--ink-3);border-bottom:1px solid var(--line);white-space:nowrap}
td:first-child,th:first-child{padding-left:0} td:last-child,th:last-child{padding-right:0}
td.n,th.n{text-align:right;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td .sub{display:block;font-size:var(--fs-small);color:var(--ink-3);margin-top:2px}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;overflow:visible}
.chart text{font-family:var(--font);font-size:11.5px;fill:var(--ink-3)}
.chart .unit-label{font-size:11.5px;fill:var(--ink-3);font-weight:500}
.chart .end-label{font-size:12px;font-weight:600}
.chart .zone{font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;fill:var(--ink-3)}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 16px rgba(30,41,59,.10);font-size:var(--fs-small);padding:8px 10px;border-radius:var(--radius-s);white-space:nowrap;z-index:6;min-width:150px}
.tip .t-h{font-weight:600;margin-bottom:4px}
.tip .t-r{display:flex;justify-content:space-between;gap:var(--sp-2)}
.tip .t-r span:first-child{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.tip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:6px var(--sp-2);font-size:var(--fs-small);color:var(--ink-3);margin-top:var(--sp-1)}
.legend i{display:inline-block;width:16px;border-top:2px solid;vertical-align:middle;margin-right:6px}

/* scenario pieces */
.scen-card{border-top:3px solid var(--c)}
.scen-card .name{color:var(--c-ink,var(--c));font-weight:600}
.scen-card .story{color:var(--ink-2);font-size:var(--fs-small);margin:var(--sp-1) 0 var(--sp-2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.scen-card .nums{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--sp-1);border-top:1px solid var(--line-soft);padding-top:12px}
.scen-card .nums div{font-size:var(--fs-micro);color:var(--ink-3)} .scen-card .nums b{display:block;font-size:18px;font-weight:500;color:var(--ink)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:baseline}
.slider-group{padding:var(--sp-2) 0;border-top:1px solid var(--line-soft)}
.slider-group:first-of-type{border-top:0;padding-top:0}
.slider-group summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;justify-content:space-between}
.slider-group summary::-webkit-details-marker{display:none}
.slider-group summary::after{content:"+";color:var(--ink-3);font-weight:400}
.slider-group[open] summary::after{content:"–"}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:12px;align-items:center;margin-top:12px;font-size:var(--fs-small)}
.srow .lbl{color:var(--ink)} .srow .lbl span{display:block;color:var(--ink-3);font-size:var(--fs-micro)}
.srow .val{text-align:right;font-weight:500}
.bars{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:110px minmax(0,1fr) 48px;gap:12px;align-items:center;font-size:var(--fs-small)}
.bar-track{height:10px;background:var(--line-soft);border-radius:5px;position:relative}
.bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--c)}
.bar-today{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-small);color:var(--ink-2);cursor:pointer;white-space:nowrap}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:var(--sp-2);counter-reset:s}
.steps li{counter-increment:s;padding-left:34px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;background:var(--tag-bg);color:var(--ink);font:600 12px/22px var(--font);text-align:center}
.signal{border-left:3px solid var(--line)}
.signal.on{border-left-color:var(--accent)}
.kv{display:grid;grid-template-columns:220px minmax(0,1fr);column-gap:var(--sp-2)}
.kv div{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.kv div:nth-child(odd){color:var(--ink-3);font-size:var(--fs-small);padding-top:12px}
@media(max-width:800px){.kv{grid-template-columns:1fr}.kv div:nth-child(odd){border-bottom:0;padding-bottom:0}.srow{grid-template-columns:minmax(0,1fr) 100px 40px}}
button.link{background:none;border:1px solid var(--line);color:var(--ink);font:500 var(--fs-small) var(--font);padding:7px 14px;border-radius:var(--radius-s);cursor:pointer}
button.link:hover{border-color:var(--ink-3)}
details.more summary{cursor:pointer;color:var(--ink-2);font-size:var(--fs-small);font-weight:500}
/* ---- v2 layout additions ---- */
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-3)}
.strip .k{font-size:var(--fs-micro);font-weight:500;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.strip .v{font-size:var(--fs-body);color:var(--ink)}
@media(max-width:800px){.strip{grid-template-columns:1fr}}
.bottomline p{font-size:15px;line-height:1.65;max-width:72ch;margin-bottom:8px;color:var(--ink)}
.bottomline h3:first-of-type{margin-top:8px!important}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-3)}
.stack .cols3{grid-template-columns:1fr;gap:var(--sp-2)}
@media(max-width:800px){.cols3{grid-template-columns:1fr}}
.col-h{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:8px}
.col-h .n{font-size:var(--fs-small);color:var(--ink-3);font-weight:400}
.plain-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13.5px}
.plain-list li{padding-left:14px;position:relative}
.plain-list li::before{content:"";position:absolute;left:0;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--ink-3)}
.plain-list .sub{display:block;font-size:var(--fs-small);color:var(--ink-3)}
.scen-card details.adj{border-top:1px solid var(--line-soft);margin-top:var(--sp-2);padding-top:12px}
.scen-card details.adj summary{cursor:pointer;font-size:var(--fs-small);font-weight:500;color:var(--ink-2);list-style:none}
.scen-card details.adj summary::-webkit-details-marker{display:none}
.scen-card details.adj summary::before{content:"▸ ";color:var(--ink-3)} .scen-card details.adj[open] summary::before{content:"▾ "}
.scen-card .srow{grid-template-columns:minmax(0,1fr) 96px 40px}
.news{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px var(--sp-2);align-items:start;padding:var(--sp-2) 0;border-top:1px solid var(--line-soft)}
.news:first-of-type{border-top:0;padding-top:4px}
.news .title{font-weight:500}
.news .eff{display:flex;gap:10px;font-size:var(--fs-small);white-space:nowrap}
.news .eff span{color:var(--ink-3)} .news .eff b{font-weight:500;color:var(--ink)}
@media(max-width:800px){.news{grid-template-columns:auto minmax(0,1fr)}.news .eff{grid-column:2}}
.subnav{display:flex;gap:var(--sp-2);flex-wrap:wrap;font-size:var(--fs-small);margin:-8px 0 var(--sp-3)}
.subnav a{color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 12px;background:var(--surface)}
.subnav a:hover{border-color:var(--ink-3);color:var(--ink)}
.anchor{scroll-margin-top:64px}
</style>

<body>
<div class="wrap">
<header class="masthead">
  <div>
    <div class="kicker">Strategic BI board · Group 7</div>
    <h1>China Solar PV Export Board</h1>
    <div class="sub" id="h-sub"></div>
  </div>
  <div class="meta" id="meta"></div>
</header>
<nav class="tabs" role="tablist" aria-label="Board sections" id="tabs"></nav>
<div id="demo"></div>
<section class="tab" id="t-overview"></section>
<section class="tab" id="t-outlook"></section>
<section class="tab" id="t-strategy"></section>
<section class="tab" id="t-context"></section>
<section class="tab" id="t-evidence"></section>
</div>
<script src="data.js"></script>
<script>
"use strict";
/* ================= data + state ================= */
const B = window.BOARD || {meta:{demo:true},content:{},series:[]};
const C = B.content;
const SCEN = (C.scenarios||[]);
const TABS = [['overview','Overview'],['outlook','Outlook'],['strategy','Strategy'],['context','Context'],['evidence','Evidence and method']];
const ALIAS = {market:'evidence',scenarios:'outlook',signals:'outlook',options:'strategy',frameworks:'context',sources:'evidence',method:'evidence',readme:'evidence'};
const KEY = 'g7-solar-board-v2';
function fresh(){return {tab:'overview',evSeries:(B.series[0]||{}).id,method:null,metric:'vol',open:{},
  params:Object.fromEntries(SCEN.map(s=>[s.id,{d:s.d,p:s.p,m:s.m}])),
  m0:C.company?C.company.m0.value:3,share:C.company?C.company.share.value:50,beta:C.company?C.company.beta.value:1,
  sigOn:Object.fromEntries((C.signals||[]).map(s=>[s.id,true])),hypo:[],
  scores:Object.fromEntries((C.options||[]).map(o=>[o.id,{...o.scores}]))}}
let S = fresh();
try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);if(p.built===B.meta.built)S=Object.assign(fresh(),p.s)}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({built:B.meta.built,s:S}))}catch(e){}}
const H = (B.meta && B.meta.horizon) || 12;

/* Hypothetical shocks: illustrative tests of how new information moves the scenarios. Not news, not evidence. */
const HYPO=[
 {id:'h1',title:'US raises tariffs on Chinese solar products further',pestle:'Political',note:'Illustrative: fewer exports to the US; strongest where trade is already closing.',eff:{A:{d:-1,p:0,m:0},B:{d:-3,p:-1,m:-0.5},C:{d:-0.5,p:0,m:0}}},
 {id:'h2',title:'Polysilicon price jumps 30%',pestle:'Economic',note:'Illustrative: input cost rises faster than module prices, squeezing margins in every future.',eff:{A:{d:0,p:1,m:-1.5},B:{d:0,p:1,m:-1.5},C:{d:0,p:1,m:-1.5}}},
 {id:'h3',title:'EU fast-tracks solar permits and relaxes dependence rules',pestle:'Legal',note:'Illustrative: more EU demand for imported modules.',eff:{A:{d:2,p:0,m:0},B:{d:1,p:0,m:0},C:{d:3,p:1,m:0.5}}}];
function allSignals(){return (C.signals||[]).concat(HYPO.filter(h=>S.hypo.includes(h.id)).map(h=>({...h,kind:'Hypothetical test',publisher:'Hypothetical',hypo:true})))}
const sigActive=g=>g.hypo?S.hypo.includes(g.id):!!S.sigOn[g.id];
/* ================= shared theme ================= */
function scKind(sc,i){const n=(sc.name||'').toLowerCase();return /base/.test(n)?'base':/challeng|pessim|downside/.test(n)?'chal':/optim|upside/.test(n)?'opt':['base','chal','opt'][i%3]}
const THEME={obs:'var(--ink)',fc:'var(--accent)',band:'var(--accent)',grid:'var(--line-soft)',axis:'var(--line)',muted:'var(--ink-3)',

  const lab=labelled.map(s=>{const p=s.pts[s.pts.length-1];return {s,y:Y(p[1]),x:X(p[0])}}).sort((a,b)=>a.y-b.y);

function spark(vals,w=104,h=32,color='var(--ink-3)'){if(!vals||vals.length<2)return '';const lo=Math.min(...vals),hi=Math.max(...vals),X=i=>2+(w-6)*i/(vals.length-1),Y=v=>h-3-(h-6)*((v-lo)/((hi-lo)||1));

/* ================= scenario engine (formulas unchanged; runs on the export-volume series) ================= */
// Market export volume:  V_t = baseline_t × (1 + d/100 × t/12)
// Company export volume index = 100 × (V_t / V_0)^beta ;  price index P_t = 100 × (1 + p/100 × t/12)
// Domestic demand G_t = domestic baseline_t × (1 + d/100 × t/12); domestic volume index = 100 × (G_t / G_0)^beta
// Company revenue index R_t = share × (Vidx × P/100) + (1 − share) × (Gidx × P/100)
// Operating margin mg_t = m0 + m × t/12 ;  operating profit per 100 of today's revenue E_t = R_t × mg_t / 100
function effects(sid,skip){return allSignals().filter(s=>sigActive(s)&&s.id!==skip).reduce((a,s)=>{const e=s.eff[sid]||{};a.d+=+e.d||0;a.p+=+e.p||0;a.m+=+e.m||0;return a},{d:0,p:0,m:0})}
function runScen(sid,withSig=true,skip=null){const s=volSer(),f=s.fc.methods[method(s)].ahead,V0=avg12(s),p=S.params[sid],e=withSig?effects(sid,skip):{d:0,p:0,m:0};
  const g=domSer(),gf=g?g.fc.methods[g.fc.default].ahead:null,G0=g?avg12(g):1;
  const d=p.d+e.d,pr=p.p+e.p,mm=p.m+e.m,sh=S.share/100;
  return f.map((b,i)=>{const t=i+1,V=b*(1+d/100*t/12),Vi=100*Math.pow(Math.max(V,1e-9)/V0,S.beta),P=100*(1+pr/100*t/12),
    G=gf?gf[Math.min(i,gf.length-1)]*(1+d/100*t/12):null,Gi=gf?100*Math.pow(Math.max(G,1e-9)/G0,S.beta):100,
    R=sh*(Vi*P/100)+(1-sh)*(Gi*P/100),mg=S.m0+mm*t/12;return {V,G,P,R,mg,E:R*mg/100}})}
// Signpost readings: computed from a board series when the indicator names one and a 12-month change.
function signpostReading(r){const ind=String(r['Indicator']||'');let s=null,level=false;
  if(/share.*(eu|us)/i.test(ind)){s=mkt('cn_pv_share_eu_us');level=true}
  else if(/eu imports/i.test(ind))s=mkt('cn_pv_exports_eu_kt');
  else if(/unit value|price/i.test(ind))s=findSer(/unit value/i);
  else if(/export.*(volume|weight)/i.test(ind))s=volSer();
  if(!s||(!level&&!/12-month change/i.test(ind)))return {v:null};
  const n=s.val.length,v=level?avg12(s):yoy12(s),th=+r['Threshold'],dir=String(r['Tripped when']||'').toLowerCase();if(v==null||isNaN(th))return {v};
  return {v,when:s.time[n-1],level,trip:dir==='below'?v<th:v>th}}

function bottomLine(){const v=volSer(),u=findSer(/USD billion|, value$/i)||B.series.find(s=>/value/i.test(s.label)&&!/unit/i.test(s.label)),p=findSer(/unit value/i);
  const fc=v.fc.methods[method(v)],out=SCEN.map(x=>({x,o:runScen(x.id)[H-1]})).sort((a,c)=>a.o.E-c.o.E);
  const O=C.options||[],rob=O.filter(o=>verdictOf(o)==='robust'),con=O.filter(o=>verdictOf(o)==='contingent');

  P.push(`The baseline forecast points to ${fv(fc.ahead[H-1])} ${shortUnit(v.unit)} a month by ${fmtMonth(v.fc.aheadTime[H-1])} (indicative range ${fv(fc.lo[H-1])}–${fv(fc.hi[H-1])}).`+(out.length?` Across the three scenarios, operating profit by ${fmtMonth(v.fc.aheadTime[H-1])} ranges from ${f2(out[0].o.E)} (${out[0].x.short.toLowerCase()}) to ${f2(out[out.length-1].o.E)} (${out[out.length-1].x.short.toLowerCase()}) per 100 of today's revenue, against ${f2(S.m0)} today.`:''));
  P.push(rob.length||con.length?`Moves that hold up in every future: ${rob.length?rob.map(o=>o.name.toLowerCase()).join('; '):'none yet'}. Moves to prepare and trigger on a signpost: ${con.length?con.map(o=>o.name.toLowerCase()).join('; '):'none'}.`:`The strategic options have not been scored yet, so no recommendation is shown. Score them under Strategy.`);
  const trip=(C.signposts||[]).filter(r=>signpostReading(r).trip);
  if(trip.length)P.push(`Warning light on: ${trip.map(r=>r['Indicator']+' is '+pct(signpostReading(r).v)+', past the '+r['Threshold']+(r['Unit']||'')+' threshold, pointing to '+(r['Points to']||'?')).join('; ')}.`);
  return P.map(x=>`<p>${esc(x)}</p>`).join('')}
function memo(){const v=volSer(),g=domSer(),u=B.series.find(x=>/value/i.test(x.label)&&!/unit/i.test(x.label)),fc=v.fc.methods[method(v)];
  const n=v.val.length,last=fmtMonth(v.time[n-1]),FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const price=(end)=>u?sum12(u,end)*1000/sum12(v,end):null,pch=u?(price(0)/price(12)-1)*100:null;
  const mv=ym=>{const i=v.time.indexOf(ym);return i<0?null:v.val[i]};const lastFull=+v.time[n-1].slice(0,4)-(v.time[n-1].endsWith('-12')?0:1);
  const yrs=[];for(let y=lastFull-2;y<=lastFull;y++){const ks=v.time.map((t,i)=>[t,v.val[i]]).filter(([t])=>t.startsWith(String(y)));const w=[mv((y-1)+'-12'),mv(y+'-01'),mv(y+'-02')],m=mv(y+'-03');if(ks.length<12||w.includes(null)||m==null)continue;yrs.push({pkMar:ks.reduce((a,b)=>b[1]>a[1]?b:a)[0].endsWith('-03'),ratio:m/(w.reduce((a,b)=>a+b,0)/3)})}

  return H3('The decision')+P('The need for solar power has grown rapidly over the last two decades. If the trend continues, the need for solar panels will keep rising. Management has to decide how to meet the increasing need while preparing for sudden changes, looking ahead to 2027. Company C sells only in China today; exporting is one of the options. China\'s exports are our monthly indicator of the industry, because no monthly data on domestic panel sales is public.')+

     (g?` At home, China's solar generation, our indicator of domestic demand, grew ${pct(yoy12(g))} to ${fv(sum12(g))} TWh.`:'')+

     (peak?` Exports usually peak in March (the top month in ${marPeaks} of the last ${yrs.length} full years), at about ${f1(Math.min(...yrs.map(y=>y.ratio)))}–${f1(Math.max(...yrs.map(y=>y.ratio)))} times the winter months (December–February).`:'')+` The record so far is ${fv(v.val[rec])} kt in ${fmtMonth(v.time[rec])}`+(v.time[rec]==='2026-03'?`, during the energy crisis (S12).`:'.'))+
   H3('The three possibilities')+

    :vol?`Exports have levelled off, so the best-tested method is the 12-month average: ${fv(fc.ahead[H-1])} ${shortUnit(s.unit)} a month by ${fmtMonth(s.fc.aheadTime[H-1])}. The scenarios bend it from ${fv(lo.o.V)} (${lo.sc.short.toLowerCase()}) to ${fv(hi.o.V)} (${hi.sc.short.toLowerCase()}).`

     <div class="eff">${SCEN.map((sc,i)=>`<span>${esc(sc.short.slice(0,4))}. <b>${c[i]==null?'off':sgn(c[i],2)}</b></span>`).join('')}</div></div>`}).join('');

     <div class="controls">${HYPO.filter(h=>!S.hypo.includes(h.id)).map(h=>`<button class="link" data-hypo="${h.id}">+ ${esc(h.title)}</button>`).join('')||'<span class="small">All three tests applied.</span>'}</div></div></div>

   ${showEach?'':proposalNote(O)}
   ${O.length?`<div class="tablewrap"><table><thead><tr><th>Option</th>${SCEN.map(s=>`<th class="n" style="color:${s.ink}">${esc(s.short)}</th>`).join('')}<th>Verdict</th><th>Signpost to act</th></tr></thead><tbody>${rows}</tbody></table></div>`:empty('No options yet (Options sheet).')}</div>
   <div class="card c-12"><div class="card-head"><div><h2>Signposts</h2><p class="takeaway">Indicators with thresholds. When one is crossed, it points to the future that is arriving and the action to take.</p></div></div>

  if(window.__mk&&$('chart-mk'))chart($('chart-mk'),window.__mk);

   <div class="card c-12 anchor" id="ev-method"><h2 style="margin-bottom:8px">Method</h2>
    <p>Four simple methods are fitted on each series: seasonal naive (the benchmark: same month last year), 12-month moving average, linear trend, and linear trend plus a monthly seasonal index. Trend methods use the last ${s.fc.fitWindow||48} months, because the market changed after 2021. The last ${s.fc.holdout} months are hidden, forecast and scored (MAPE, RMSE). The board uses the lowest-error method that beats the benchmark and forecasts to ${esc(fmtMonth(s.fc.aheadTime[s.fc.aheadTime.length-1]))} from all data. For exports the 12-month average wins because volumes have levelled off since 2025; for domestic solar generation the trend with seasonality wins clearly. The shaded range is ±1.28 × holdout RMSE, widening with the square root of the step: an indicative guide, not a statistical interval. Scenarios shift the volume baseline, the export price and the operating margin by the assumptions on the Outlook tab.</p>
    <h3 style="margin:var(--sp-3) 0 8px">Terms</h3><dl class="terms"><dt>Holdout test</dt><dd>Hide the last 12 months, let each method forecast them, then compare with what really happened. Why: it tests the method on data it has not seen, like a real forecast. <span class="ex">Example: the methods only saw data up to Oct 2025 and had to forecast Nov 2025 to Oct 2026.</span></dd><dt>Seasonal naive (benchmark)</dt><dd>Forecast = the same month one year earlier. Why: the simplest sensible guess. A method is only worth using if it beats this. <span class="ex">Example: the forecast for Mar 2026 is Mar 2025's 1,248 kt; the actual was 1,777 kt.</span></dd><dt>12-month moving average</dt><dd>The average of the last 12 months, carried forward flat. Why: robust when a series has stopped growing. <span class="ex">Example: the average of the 12 months to ${esc(fmtMonth(volSer().time[volSer().time.length-1]))} is about ${fv(sum12(volSer())/12)} kt, used for every month to ${esc(fmtMonth(volSer().fc.aheadTime[H-1]))}.</span></dd><dt>Linear trend</dt><dd>A straight line fitted to the last 48 months. With seasonal index: the line plus each calendar month's typical up or down. <span class="ex">Example: if exports grew 10 kt a month over four years, the line keeps adding 10 kt a month; the seasonal index adds the usual March peak.</span></dd><dt>MAPE</dt><dd>Mean absolute percentage error: the average size of the miss, as a % of the actual value. 18.5% means the forecast was off by 18.5% on average. Why: easy to read and to compare across series with different units. <span class="ex">Example: actual 1,000 kt, forecast 900 kt = a 10% miss. MAPE is the average of the 12 monthly misses.</span></dd><dt>RMSE</dt><dd>Root mean squared error: the typical miss in the series' own unit (e.g. kt), counting big misses more. Why: it sets the width of the shaded range. <span class="ex">Example: the 12-month average has an RMSE of about ${fv(volSer().fc.methods.ma12.rmse)} kt, so a typical monthly miss was around that size.</span></dd><dt>Shaded range</dt><dd>±1.28 × holdout RMSE, widening with the square root of months ahead. Covers about 80% of outcomes if past errors repeat; indicative, not a statistical interval. <span class="ex">Example: 12 months ahead the range is about 1.28 × ${fv(volSer().fc.methods.ma12.rmse)} ≈ ±${fv(1.2816*volSer().fc.methods.ma12.rmse)} kt around the forecast.</span></dd><dt>48-month fit window</dt><dd>Trend methods only use the last four years, because the market changed sharply after 2021. <span class="ex">Example: the trend uses Nov 2022 to Oct 2026, not 2017, when exports were a fraction of today's.</span></dd><dt>Export price (unit value)</dt><dd>Export value ÷ export weight, in USD per kg. Why: customs data has no price, so this is the best price signal. <span class="ex">Example: 31.91 bn USD ÷ 12,524 kt (12 months to Oct 2026) = 2.55 USD per kg.</span></dd><dt>kt</dt><dd>Thousand tonnes (weight of exported cells and modules). <span class="ex">Example: 1,093 kt = 1.09 million tonnes, China's exports in Oct 2026.</span></dd><dt>Profit per 100 of today's revenue</dt><dd>Company C's operating profit in a scenario, scaled so today's revenue = 100. Today's value equals the starting margin (1%). Illustrative, not real company data. <span class="ex">Example: ${(()=>{const b=SCEN.find(x=>x.kind==='base');return b?`Base shows ${f2(runScen(b.id)[H-1].E)} in ${esc(fmtMonth(volSer().fc.aheadTime[H-1]))}: on today's revenue of 100, profit would be ${f2(runScen(b.id)[H-1].E)} (today ${f2(S.m0)}).`:''})()}</span></dd></dl>

function mdHTML(src){const out=[];let list=null,code=null,para=[];
  const inl=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b style="font-weight:600">$1</b>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  const flushP=()=>{if(para.length){out.push('<p>'+inl(para.join(' '))+'</p>');para=[]}},flushL=()=>{if(list){out.push(`<${list.t} class="md-list">`+list.items.map(i=>'<li>'+inl(i)+'</li>').join('')+`</${list.t}>`);list=null}};
  String(src||'').split(/\r?\n/).forEach(line=>{
    if(code!==null){if(/^```/.test(line)){out.push('<pre class="md-code">'+esc(code.join('\n'))+'</pre>');code=null}else code.push(line);return}
    if(/^```/.test(line)){flushP();flushL();code=[];return}
    let m;
    if((m=line.match(/^(#{1,3})\s+(.*)/))){flushP();flushL();const lv=m[1].length;if(lv===1)return;out.push(`<h${lv+1} class="md-h">${inl(m[2])}</h${lv+1}>`);return}
    if((m=line.match(/^\s*(?:-|\*)\s+(.*)/))){flushP();if(!list||list.t!=='ul'){flushL();list={t:'ul',items:[]}}list.items.push(m[1]);return}
    if((m=line.match(/^\s*\d+\.\s+(.*)/))){flushP();if(!list||list.t!=='ol'){flushL();list={t:'ol',items:[]}}list.items.push(m[1]);return}
    if(/^\s{2,}\S/.test(line)&&list){list.items[list.items.length-1]+=' '+line.trim();return}
    if(!line.trim()){flushP();flushL();return}
    flushL();para.push(line.trim())});
  flushP();flushL();if(code!==null)out.push('<pre class="md-code">'+esc(code.join('\n'))+'</pre>');return out.join('')}
/* ================= shell ================= */
const R={overview:renderOverview,outlook:renderOutlook,strategy:renderStrategy,context:renderContext,evidence:renderEvidence};
function render(){$('tabs').innerHTML=TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}" aria-controls="t-${k}">${l}</button>`).join('');
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));
  TABS.forEach(([k])=>$('t-'+k).classList.toggle('on',S.tab===k));
  const y=window.scrollY;if(!B.series.length){$('t-'+S.tab).innerHTML=empty('No data. Run scripts/build.py.');return}
  try{R[S.tab]()}catch(err){$('t-'+S.tab).innerHTML=empty('This view failed to render: '+esc(err.message));console.error(err)}
  document.querySelectorAll('#t-'+S.tab+' a[href^="#"]').forEach(a=>{const h=a.getAttribute('href').slice(1);if(TABS.some(t=>t[0]===h))a.onclick=ev=>{ev.preventDefault();go(h)}});
  window.scrollTo(0,y)}
function go(t){S.tab=t;history.replaceState(null,'','#'+t);commit();window.scrollTo(0,0)}
function commit(){save();render()}
function fromHash(){let h=location.hash.slice(1);h=ALIAS[h]||h;return TABS.some(t=>t[0]===h)?h:null}
header();
(function(){const h=fromHash();if(h)S.tab=h;render()})();
addEventListener('hashchange',()=>{const h=fromHash();if(h&&h!==S.tab){S.tab=h;render()}});
let rz,lw=innerWidth;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(innerWidth!==lw){lw=innerWidth;render()}},150)});
if(document.fonts)document.fonts.ready.then(()=>render());
</script>
